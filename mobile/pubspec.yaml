name: nova_ai_mobile
description: NOVA AI - private offline AI assistant powered by an on-device open model.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.10.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  llamadart: ^0.19.11
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
