name: Build NOVA AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.novaai .

      - name: Allow first-run model download
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in source:
              source = source.replace(
                  '<application',
                  permission + '\n    <application',
                  1,
              )
          manifest.write_text(source)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze lib --no-fatal-infos

      - name: Build release APK (retry on repository rate limits)
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            echo "APK build attempt $attempt of 4"
            if flutter build apk --release; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 30))
              echo "Build failed. Waiting ${delay}s before retrying..."
              sleep "$delay"
            fi
          done
          echo "APK build failed after 4 attempts."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-ai-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
